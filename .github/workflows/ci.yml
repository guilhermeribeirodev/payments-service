name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest # Docker is preinstalled, which the Testcontainers tests need
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 } # replace with the wrapper once `gradle wrapper` has been run and committed
      - name: Format, unit + integration tests, coverage
        run: gradle spotlessCheck check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            build/reports/tests
            build/reports/jacoco

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@1 lint src/main/resources/openapi/payments-api.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code src/api/schema.d.ts # generated types must be committed
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t payments-service:${{ github.sha }} .
