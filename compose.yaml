# `docker compose up -d db jaeger` for local development, `docker compose up --build` to run everything.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      retries: 10

  jaeger: # trace UI at http://localhost:16686, OTLP/HTTP ingest on 4318
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

  app:
    build: .
    profiles: ["full"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/payments
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    ports: ["8080:8080"]
